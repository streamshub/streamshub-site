name: Cache Tagged Docs

on:
  push:
    branches:
      - main
    paths:
      - sources.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "cache-tagged-docs"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup JBang
        uses: jbangdev/setup-jbang@main

      - name: Checkout site source
        uses: actions/checkout@v7

      - name: Download tagged docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: jbang scripts/docBuilder.java --tags-only --cleanup

      - name: Create PR with cached docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "No new tagged docs to cache"
            exit 0
          fi

          BRANCH="ci/cache-tagged-docs"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "ci: cache tagged documentation versions"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR #$EXISTING_PR"
          else
            gh pr create \
              --title "ci: cache tagged documentation versions" \
              --body "Automated PR to cache tagged documentation snapshots.

          This PR was created by the **Cache Tagged Docs** workflow after detecting
          new or removed tagged versions in \`sources.json\`. Tagged documentation is
          committed to the repository so that the daily publish workflow does not need
          to re-download it."
          fi
